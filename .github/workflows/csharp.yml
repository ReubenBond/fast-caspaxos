name: C# CI

on:
  push:
    paths:
      - 'csharp/**'
      - 'global.json'
      - '.github/workflows/csharp.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - 'global.json'
      - '.github/workflows/csharp.yml'
  workflow_dispatch:

jobs:
  source-boundary:
    name: Embedded source boundary and Native AOT client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.2.26504.105
      - name: Build isolated consumer and publish Native AOT client
        shell: pwsh
        run: ./csharp/scripts/Test-SourceBoundary.ps1 -PublishAot

  test:
    name: Core, register, SQLite, REST, gRPC, and simulation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.2.26504.105
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: dotnet test csharp/FastCASPaxos.slnx --configuration Release --verbosity minimal
      - name: Build .NET 10 transport with C# latest
        run: |
          dotnet build csharp/src/FastCASPaxos.Grpc/FastCASPaxos.Grpc.csproj --framework net10.0 --configuration Release --no-restore --verbosity minimal
          dotnet build csharp/src/FastCASPaxos.Rest/FastCASPaxos.Rest.csproj --framework net10.0 --configuration Release --no-restore --verbosity minimal
      - name: Build runnable host and smoke client
        run: |
          dotnet build csharp/src/FastCASPaxos.Host/FastCASPaxos.Host.csproj --configuration Release --no-restore --verbosity minimal
          dotnet build csharp/samples/FastCASPaxos.Grpc.Smoke/FastCASPaxos.Grpc.Smoke.csproj --configuration Release --no-restore --verbosity minimal
      - name: Three-process REST, gRPC, and SSE smoke, outage, and restart
        shell: pwsh
        run: ./csharp/scripts/Test-GrpcCluster.ps1
