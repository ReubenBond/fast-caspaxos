name: C# CI

on:
  push:
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp.yml'
  workflow_dispatch:

jobs:
  test:
    name: Core, register, SQLite, REST, gRPC, and simulation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test csharp/FastCASPaxos.slnx --configuration Release --verbosity minimal
      - name: Build .NET 8 transport
        run: |
          dotnet build csharp/src/FastCASPaxos.Grpc/FastCASPaxos.Grpc.csproj --framework net8.0 --configuration Release --no-restore --verbosity minimal
          dotnet build csharp/src/FastCASPaxos.Rest/FastCASPaxos.Rest.csproj --framework net8.0 --configuration Release --no-restore --verbosity minimal
      - name: Build runnable host and smoke client
        run: |
          dotnet build csharp/src/FastCASPaxos.Host/FastCASPaxos.Host.csproj --configuration Release --no-restore --verbosity minimal
          dotnet build csharp/samples/FastCASPaxos.Grpc.Smoke/FastCASPaxos.Grpc.Smoke.csproj --configuration Release --no-restore --verbosity minimal
      - name: Three-process REST and gRPC smoke, outage, and restart
        shell: pwsh
        run: ./csharp/scripts/Test-GrpcCluster.ps1
