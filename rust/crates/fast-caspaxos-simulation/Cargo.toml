[package]
name = "fast-caspaxos-simulation"
version = "0.1.0"
edition = "2021"
description = "Deterministic simulation harness for Fast CASPaxos using turmoil"
license = "MIT"

[features]
default = []
turmoil = ["dep:turmoil", "dep:tokio", "dep:bincode"]

[dependencies]
fast-caspaxos-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, optional = true }
turmoil = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
