[workspace]
resolver = "2"
members = [
    "crates/fast-caspaxos-core",
    "crates/fast-caspaxos-simulation",
    "crates/fast-caspaxos-scenarios",
]

[workspace.dependencies]
fast-caspaxos-core = { path = "crates/fast-caspaxos-core" }
fast-caspaxos-simulation = { path = "crates/fast-caspaxos-simulation" }
fast-caspaxos-scenarios = { path = "crates/fast-caspaxos-scenarios" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
proptest = "1"
proptest-derive = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
turmoil = "0.7"
bincode = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow these common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
